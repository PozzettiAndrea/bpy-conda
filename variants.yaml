# Static variant config for rattler-build.
# The actual build matrix comes from packages/bpy.yml via generate_matrix.py;
# rattler-build picks the specific cell using --variant flags from CI.
#
# We deliberately leave c_stdlib / c_stdlib_version unpinned here so that
# rattler-build picks the platform-appropriate default (sysroot 2.28 on linux,
# the macOS SDK on osx, ucrt on win). Pinning them statically broke macOS.
{}
