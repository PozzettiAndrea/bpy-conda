context:
  # Recipe directory is `bpy_lts_3_6` — Blender 3.6 LTS, the only Blender
  # release that supports Python 3.10. 3.6 LTS shipped 2023-06-27; extended
  # maintenance through mid-2025. Output is still named `bpy` so users
  # `conda install bpy=3.6.*` to get this build.
  name: bpy
  version: ${{ blender_version }}
  # Clone from the GitHub mirror (much faster than projects.blender.org).
  # build.sh sets `lfs.url` to projects.blender.org explicitly before
  # `git lfs pull` so LFS objects (icon DATs etc.) still resolve.
  source_url: "https://github.com/blender/blender.git"
  source_tag: "v${{ blender_version }}"
  py_short: ${{ python | replace('.', '') }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: ${{ source_url }}
  tag: ${{ source_tag }}
  # Blender's tree contains submodules (addons, dev tools); we don't need a deep
  # history but `make update` will fetch the precompiled lib bundle separately.
  depth: 1

build:
  # _1/_2: stripped bundled TBB, depended on conda-forge `tbb` run-dep.
  # Did not actually fix the loader race — see recipes/bpy/recipe.yaml.
  # _3: full IAT mangling via scripts/mangle_bpy_dlls.py. Renames every
  # bundled DLL in bpy\ to a "bpy_*" private namespace and rewrites
  # bpy.pyd / sibling DLL import tables to match. Self-contained bpy,
  # no env tbb dependency, no possible basename collision with torch
  # / embreex. See recipes/bpy/recipe.yaml for the full rationale.
  number: 3
  # No hyphens in the build string — anaconda.org's repodata indexer parses
  # `{name}-{version}-{build}.conda` filenames; a hyphen in the build string
  # (e.g. "osx-arm64") makes the indexer mis-split and the package shows up
  # on the channel as `bpy-3.6.23` instead of `bpy`.
  string: "py${{ py_short }}"
  # rattler-build auto-detects build.sh / build.bat sitting next to recipe.yaml,
  # so no explicit `script:` entry is needed.

requirements:
  build:
    - cmake >=3.28
    - ninja
    - git
    - git-lfs
    - if: unix
      then:
        # subversion is required for Blender's `make_update.py` on Linux/macOS
        # (lib bundles fetched via svn checkout). conda-forge doesn't ship
        # subversion for win-64 — Blender's Windows lib bundle path may not
        # need it, but we'll find out.
        - subversion
    - if: linux
      then:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - make
        - patchelf
    - if: osx
      then:
        # Pin clang <22 on macOS — clang 22 added strict constexpr enforcement
        # for non-type template arguments which Blender 3.6's bundled Boost 1.x
        # (boost/mpl/aux_/integral_wrapper.hpp) doesn't satisfy. Older clangs
        # accepted the same templates fine. Bypassing compiler() macro since
        # we want an explicit version constraint.
        - clang_osx-arm64 <22
        - clangxx_osx-arm64 <22
        - make
    - if: win
      then:
        # Blender 4.2's platform_win32.cmake requires MSVC 14.29+ (VS 2019).
        # Conda-forge default vs2017_win-64 (MSVC 14.16) is rejected with
        # "Compiler is unsupported". vs2022_win-64 ships MSVC 14.4x.
        - vs2022_win-64
  host:
    - python ${{ python }}.*
    - pip
    - setuptools
    # Audaspace's Python bindings #include <numpy/ndarrayobject.h>.
    - numpy
    # py-lief drives scripts/mangle_bpy_dlls.py — rewrites bundled
    # PE import tables. Build-time only. See recipes/bpy/recipe.yaml.
    - pefile
    # No conda-forge libboost — we patch bundle Boost's integral_wrapper.hpp
    # in place (Boost 1.86 backport) so clang 21+ accepts it. Bundle Boost
    # stays as the source of truth for header AND lib (avoids ABI mixing
    # vs bundle's pre-compiled libboost_python.dylib).
    # Blender's lib bundle ships its own copies of OpenImageIO, OSL, OpenVDB,
    # OpenSubdiv, USD, Embree, etc. — we deliberately do NOT add them to
    # `host` because mixing the bundle versions with conda-forge versions leads
    # to ABI mismatches at link time.
    - if: linux
      then:
        # X11 dev headers — conda's sysroot isolates the build from system
        # /usr/include and /usr/lib, so apt-installed X11 isn't visible to
        # CMake. Pull the dev libs in as conda packages instead.
        - xorg-libx11
        - xorg-libxext
        - xorg-libxxf86vm
        - xorg-libxcursor
        - xorg-libxi
        - xorg-libxrandr
        - xorg-libxinerama
        # No xorg-xproto (conflicts with system X11 KB headers).
        - libxkbcommon-cos7-x86_64
        - dbus
        # OpenGL + EGL headers — Blender's bundled OpenSubdiv pulls in GL/gl.h,
        # and ghost/XR uses EGL/eglplatform.h. Same sysroot-isolation issue.
        - mesa-libgl-cos7-x86_64
        - mesa-libgl-devel-cos7-x86_64
        - mesa-libegl-cos7-x86_64
        - mesa-libegl-devel-cos7-x86_64
  run:
    - python ${{ python }}.*
    # OpenMP runtime is NOT bundled (build.sh strips libomp.so* / libomp.dylib
    # from bpy/lib/ during staging). This matches the conda-forge convention:
    # one OpenMP runtime per env, mediated by `_openmp_mutex`. Pulling the same
    # llvm-openmp / vc14_runtime that conda-forge numpy depends on prevents
    # the classic "OMP: Error #15: libiomp5 already initialized" clash with
    # numpy-MKL.
    - if: not win
      then:
        - llvm-openmp
    - if: win
      then:
        - vc14_runtime
        # No `tbb` run-dep: bpy bundles its own TBB under a private
        # "bpy_*" namespace via scripts/mangle_bpy_dlls.py. See
        # recipes/bpy/recipe.yaml for the loader-race rationale.

about:
  homepage: https://www.blender.org/
  repository: https://projects.blender.org/blender/blender
  license: GPL-2.0-or-later
  license_file:
    - COPYING
  summary: Blender as a Python module (bpy) — community-built conda package
  description: |
    The `bpy` Python module exposes Blender's Python API as a standalone
    importable module. This package is built from upstream Blender source
    (tag pinned in the recipe) using `cmake -DWITH_PYTHON_MODULE=ON`.

    This is an unofficial community build. It is not endorsed by, affiliated
    with, or sponsored by the Blender Foundation. See NOTICE.md in the
    PozzettiAndrea/bpy-conda repository for GPL source-availability details.

tests:
  # See recipes/bpy/recipe.yaml for the rationale.

  - script:
      - python -c "import bpy; print('OK', bpy.app.version_string); import atexit, os; atexit._clear(); os._exit(0)"

  - script:
      - python -c "import numpy; import bpy; print('OK both', bpy.app.version_string); import atexit, os; atexit._clear(); os._exit(0)"
    requirements:
      run:
        - python ${{ python }}.*
        - numpy

  - script:
      - python -c "import bpy, bmesh; from mathutils import Vector, Matrix; v=Vector((3.0,4.0,0.0)); assert abs(v.length-5.0)<1e-9; assert (Matrix.Identity(4)@v.to_4d()).to_3d()==v; bpy.ops.wm.read_homefile(use_factory_startup=True); s=bpy.context.scene; s['_smk']=42; assert s['_smk']==42; del s['_smk']; bm=bmesh.new(); v0=bm.verts.new((0,0,0)); v1=bm.verts.new((1,0,0)); v2=bm.verts.new((1,1,0)); bm.faces.new((v0,v1,v2)); assert len(bm.verts)==3 and len(bm.faces)==1; bm.free(); print('OK smoke_api', bpy.app.version_string); import atexit, os; atexit._clear(); os._exit(0)"
    requirements:
      run:
        - python ${{ python }}.*

extra:
  recipe-maintainers:
    - PozzettiAndrea
