name: bpy_lts_3_6
source_repo: blender/blender
# Blender 3.6 LTS — released 2023-06-27, extended maintenance through 2025.
# This is the only Blender LTS that supports Python 3.10. The recipe
# (recipes/bpy_lts_3_6/) carries the same compiler-strictness patches as
# bpy_lts (4.2.20) and may need additional ones — its 2023 lib bundle is
# even older than 4.2's 2024 bundle. Expect iteration.
source_tag: "v3.6.23"

free_disk_space: true

build_matrix:
  # Blender 3.6 LTS source uses CPython internals (`_PyArg_Parser` etc.)
  # that Python 3.12 removed. There is no source patch on Blender's
  # 3.6-LTS branch to support newer Pythons. So linux+osx-arm64 are
  # capped at py3.10/3.11. Windows happens to compile against py3.12+
  # because the Windows build path doesn't hit the same internal-API
  # paths, so we keep the full python range there.
  combinations:
    - blender_version: "3.6.23"
      python_versions: ["3.10", "3.11"]
      platforms: ["linux", "osx-arm64", "windows"]
    - blender_version: "3.6.23"
      python_versions: ["3.12", "3.13", "3.14"]
      platforms: ["windows"]
  platforms: ["linux", "windows", "osx-arm64"]
