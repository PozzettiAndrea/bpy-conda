name: Build bpy conda packages
run-name: "${{ inputs.package }} ${{ inputs.blender }} | py${{ inputs.python }} | ${{ inputs.platform }}${{ inputs.overwrite && ' [overwrite]' || '' }}"

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Recipe to build'
        required: false
        default: 'bpy'
        type: choice
        options:
          - bpy
          - bpy_lts
          - bpy_lts_3_6
          - all
      python:
        description: 'Python version filter (or "all")'
        required: false
        default: 'all'
        type: string
      blender:
        description: 'Blender version filter, e.g. "4.2.20" (or "all")'
        required: false
        default: 'all'
        type: string
      platform:
        description: 'Platform filter (linux, windows, osx-arm64, or "all")'
        required: false
        default: 'all'
        type: string
      overwrite:
        description: 'Rebuild even if package already exists on the channel'
        required: false
        default: false
        type: boolean

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pyyaml
        run: pip install pyyaml

      - name: Generate build matrix
        id: matrix
        run: |
          python3 scripts/generate_matrix.py \
            --package "${{ inputs.package }}" \
            --python "${{ inputs.python }}" \
            --blender "${{ inputs.blender }}" \
            --platform "${{ inputs.platform }}" \
            ${{ inputs.overwrite && '--overwrite' || '' }} \
            --channel pozzettiandrea

  build:
    needs: generate-matrix
    if: ${{ needs.generate-matrix.outputs.matrix != '[]' && needs.generate-matrix.outputs.matrix != '' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    name: "${{ matrix.package }} ${{ matrix.blender_version }} | py${{ matrix.python }} | ${{ matrix.platform }}"
    steps:
      - uses: actions/checkout@v4

      # ── Free disk space (Linux only — runner starts with ~14GB free, the
      #    Blender lib bundle alone is ~5GB and the build adds several more) ──
      - name: Free disk space (Linux)
        if: matrix.platform == 'linux'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Add swap (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      # Blender on Linux pulls in X11/Wayland system libs even with WITH_GHOST_*
      # disabled — its lib bundle's USD/OpenSubdiv components have transitive
      # X11 deps. Install the dev headers system-wide so CMake's find_package
      # succeeds.
      - name: Install Linux system deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxxf86vm-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxinerama-dev libxkbcommon-dev libwayland-dev libegl-dev \
            libdbus-1-dev libsm-dev libice-dev

      # ── rattler-build install ──
      - name: Install rattler-build (Linux)
        if: matrix.platform == 'linux'
        run: |
          curl -fsSL https://github.com/prefix-dev/rattler-build/releases/latest/download/rattler-build-x86_64-unknown-linux-musl.tar.gz \
            | tar xz -C /usr/local/bin/ --strip-components=1
          rattler-build --version

      - name: Install rattler-build (macOS arm64)
        if: matrix.platform == 'osx-arm64'
        run: |
          curl -fsSL https://github.com/prefix-dev/rattler-build/releases/latest/download/rattler-build-aarch64-apple-darwin.tar.gz \
            | sudo tar xz -C /usr/local/bin/ --strip-components=1
          rattler-build --version

      - name: Install rattler-build (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $dest = "$env:USERPROFILE\.local\bin"
          $url = "https://github.com/prefix-dev/rattler-build/releases/latest/download/rattler-build-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile rattler-build.zip
          Expand-Archive -Path rattler-build.zip -DestinationPath $env:TEMP -Force
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Move-Item "$env:TEMP\rattler-build-x86_64-pc-windows-msvc\rattler-build.exe" "$dest\rattler-build.exe" -Force
          echo $dest | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$dest\rattler-build.exe" --version

      # ── Build ──
      - name: Build package (Unix)
        if: matrix.platform != 'windows'
        run: |
          set -o pipefail
          rattler-build build --no-build-id --allow-network --no-test \
            --recipe recipes/${{ matrix.package }}/recipe.yaml \
            --variant-config variants.yaml \
            --channel conda-forge \
            --variant python=${{ matrix.python }} \
            --variant blender_version=${{ matrix.blender_version }} \
            2>&1 | tee build.log

      - name: Build package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          rattler-build build --no-build-id --allow-network --no-test `
            --recipe recipes/${{ matrix.package }}/recipe.yaml `
            --variant-config variants.yaml `
            --channel conda-forge `
            --variant python=${{ matrix.python }} `
            --variant blender_version=${{ matrix.blender_version }} `
            2>&1 | Tee-Object -FilePath build.log

      # ── Upload to anaconda.org ──
      - name: Upload to anaconda.org (Unix)
        if: success() && matrix.platform != 'windows'
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          set -euo pipefail
          # Pin setuptools<81 — newer versions drop pkg_resources which
          # anaconda-client < 1.14 still imports.
          pip install "anaconda-client<1.14" "setuptools<81"
          if [[ -z "${ANACONDA_API_TOKEN:-}" ]]; then
            echo "::warning::ANACONDA_TOKEN not set — skipping upload (artifact still uploaded as GHA artifact)"
            exit 0
          fi
          # Loop with explicit error propagation; `find -exec ... \;` swallows
          # individual command failures.
          shopt -s globstar nullglob
          uploaded=0
          for f in output/**/*.conda; do
            echo "==> Uploading $f"
            anaconda upload --force "$f"
            uploaded=$((uploaded+1))
          done
          if [[ $uploaded -eq 0 ]]; then
            echo "::error::No .conda artifacts found to upload"
            exit 1
          fi

      - name: Upload to anaconda.org (Windows)
        if: success() && matrix.platform == 'windows'
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pip install "anaconda-client<1.14" "setuptools<81"
          if (-not $env:ANACONDA_API_TOKEN) {
            Write-Host "::warning::ANACONDA_TOKEN not set — skipping upload"
            exit 0
          }
          $files = Get-ChildItem -Recurse -Filter "*.conda" output/
          if ($files.Count -eq 0) {
            Write-Host "::error::No .conda artifacts found to upload"
            exit 1
          }
          foreach ($f in $files) {
            Write-Host "==> Uploading $($f.FullName)"
            anaconda upload --force $f.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bpy-${{ matrix.blender_version }}-py${{ matrix.python }}-${{ matrix.subdir }}
          path: |
            output/**/*.conda
            build.log
